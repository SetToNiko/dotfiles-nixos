<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme: CRT Amber</title>
  <style>
    /* colours from the active palette */
    :root {
      --bg0: #1d1408;
      --fg0: #ffb000;
      --accent: #ff7a00;
      --mono: "JetBrains Mono", "Iosevka", monospace;
      --ui: "Inter", system-ui, sans-serif;
    }
    body {
      margin: 0;
      background: var(--bg0);
      color: var(--fg0);
      font: 16px/1.5 var(--ui);
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
      gap: 0.5rem;
    }
    .swatch { padding: 1rem; border-radius: 4px; border: 1px solid rgb(255 176 0 / 0.3); }
    code, pre { font-family: var(--mono); font-size: 0.9em; }
    a:hover, button:focus-visible { outline: 2px solid var(--accent); }
    @media (max-width: 600px) {
      .swatches { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <!-- generated by theme-switch -->
  <header>
    <h1>CRT Amber</h1>
    <p>Fonts: <code>JetBrains Mono 14</code> for code, Inter 11 for the rest.</p>
  </header>
  <main>
    <section class="swatches" aria-label="Palette">
      <div class="swatch" style="background: #1d1408">bg0</div>
      <div class="swatch" style="background: #ffb000; color: #1d1408">fg0</div>
      <div class="swatch" style="background: #ff7a00">accent</div>
    </section>
    <pre><code>0O 1lI {} [] () =&gt; != &lt;= -&gt;</code></pre>
    <button type="button" onclick="navigator.clipboard.writeText('CRT Amber')">Copy name</button>
  </main>
</body>
</html>
